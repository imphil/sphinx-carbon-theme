[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sphinx-carbon-theme"
dynamic = ["version"]
description = "A Sphinx theme implementing the IBM Carbon Design System"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["sphinx>=8.0"]
classifiers = [
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation :: Sphinx",
]

[project.entry-points."sphinx.html_themes"]
carbon = "sphinx_carbon_theme"

[dependency-groups]
test = ["pytest>=8", "beautifulsoup4>=4.12"]
docs = ["sphinx-autobuild"]

[tool.hatch.version]
path = "src/sphinx_carbon_theme/__init__.py"

[tool.hatch.build]
# The compiled assets are git-ignored but must be shipped.
artifacts = [
    "src/sphinx_carbon_theme/theme/carbon/static/**",
    "src/sphinx_carbon_theme/theme/carbon/partials/icons/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/assets",
    "/scripts",
    "/package.json",
    "/package-lock.json",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_carbon_theme"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
